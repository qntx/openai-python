[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qntx-openai"
version = "1.0.0"
description = "Drop-in OpenAI Python client with transparent x402 payment support."
readme = "README.md"
license = "MIT"
authors = [
    { name = "QNTX", email = "x@qntx.fun" },
]
requires-python = ">=3.12"
keywords = ["openai", "x402", "payment", "crypto", "usdc", "llm", "ai"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "openai>=3.7.0",
    "httpx2>=2.12.0",
    "x402>=2.21.0",
]

[project.optional-dependencies]
evm = [
    "x402[evm]>=2.21.0",
    "eth-account>=0.13.0",
]
svm = [
    "x402[svm]>=2.21.0",
    # x402 2.21 ExactSvmScheme imports solana.rpc.api, removed in solana 0.40.
    "solana>=0.36.0,<0.40",
]
tvm = [
    "x402[tvm]>=2.21.0",
]
all = [
    "qntx-openai[evm]",
    "qntx-openai[svm]",
    "qntx-openai[tvm]",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.0",
    "ruff>=0.8",
    "pre-commit>=4.0",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/qntx/openai-python"
Repository = "https://github.com/qntx/openai-python"
Issues = "https://github.com/qntx/openai-python/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/qntx"]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401",  # dynamically typed expressions (Any)
]

[tool.ruff.lint.isort]
known-first-party = ["qntx"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "eth_account",
    "eth_account.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
