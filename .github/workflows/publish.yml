name: Publish

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  publish:
    uses: qntx/workflows/.github/workflows/publish-pypi.yml@v2
    permissions:
      contents: read
      id-token: write
      attestations: write
    with:
      python-version: '3.13'
    secrets:
      PYPI_TOKEN: ${{ secrets.PYPI_TOKEN || secrets.PYPI_API_TOKEN }}
